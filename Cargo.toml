[workspace]
resolver = "2"
members = [
  "crates/cli",
  "crates/downloader",
  #[ Converter ]
  "crates/aozora",
  "crates/wiki",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
downloader = { path = "crates/downloader" }
aozora = { path = "crates/aozora" }
wiki = { path = "crates/wiki" }
tmtbook = { git = "https://github.com/tomet-lang/tomet-book.git" }

#[ Crates.io ]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
encoding_rs = "0.8"
indicatif = "0.17"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
